name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref - the latest push is the one we care about.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, smoke tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The Prisma client is generated at predev/install time. CI doesn't run
      # a database, so we point at the bundled SQLite fixture and provide a
      # placeholder SESSION_SECRET that satisfies the >=32 char guard.
      DATABASE_URL: "file:./dev.db"
      SESSION_SECRET: "ci-placeholder-session-secret-aaaaaaaaaaaaaaaaaaaaaaaa"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (SQLite for CI)
        run: node scripts/dev-db.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: TypeScript (tests)
        run: npx tsc -p tsconfig.test.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: npm run test:smoke

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Two gates, because what ships and what only runs on a developer machine
      # carry different risk:
      #   - Production dependencies fail on any high or critical advisory.
      #   - The whole tree, dev tooling included, fails on critical.
      # Dev-only highs (today: ESLint's and Storybook's file-watching chains,
      # where the `braces` advisory covers every published version) are
      # reported by the last step without blocking, so they stay visible.
      # Review https://github.com/shafaypro/DecisionOS/security/advisories for details.
      - name: npm audit - production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit - all dependencies (critical)
        run: npm audit --audit-level=critical

      - name: npm audit - full report (informational)
        run: npm audit || true

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Verifies the multi-stage Dockerfile assembles: the slim serving image
      # (production deps only) and the one-shot migrator image.
      - name: Build serving image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
